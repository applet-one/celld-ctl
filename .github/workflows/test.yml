name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/test_deploy_keys.py
      - run: python3 scripts/test_load_test.py
      - run: python3 scripts/test_ssh_relay.py
      - run: python3 scripts/test_install_host.py
      - run: sh -n scripts/install-host.sh scripts/celld-run
  macos-developer:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p cella --locked
      - run: python3 scripts/test_ssh_relay.py
