[package]
name = "cella"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local celld development and restricted SSH deployment client"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
