# Install root-owned as /etc/ssh/sshd_config.d/60-cella-deploy.conf.
Match User cella-deploy
    AuthorizedKeysFile /etc/ssh/cella-deploy/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/bin/sudo -n /usr/local/bin/celld-ctl transport
Match all
